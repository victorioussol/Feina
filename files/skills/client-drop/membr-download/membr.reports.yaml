# Membr download config. POS selectors were checked on one supervised run, 2026-10-26.
# The script opens club_base_url, then only the hosts listed in allowed_hosts.
# It never calls any other host and it never calls an internal endpoint.
club_base_url: "https://REPLACE_CLUB.membr.com"
timezone: Europe/Madrid
# TODO: the export download-time metadata is UTC. Whether From/Until are
# interpreted in UTC or in timezone (Europe/Madrid) is not established.
# The manifest records date_filter_timezone as unverified.
pos_report_id: pos_transactions
gym_name: "Anytime Fitness Sant Adrià"
allowed_hosts:
  - insights.eu.membr.com
browser:
  cdp_url: "http://127.0.0.1:9222"
  # Must be the same directory as browser.user_data_dir in ~/.hermes/config.yaml.
  user_data_dir: "~/.hermes/browser-profile"
  # Live 2026-10-26: none of the guessed session-cookie names exist. Auth is
  # held in page storage. cookie_names stays empty so it cannot be read as a
  # login signal. Observed non-session cookies were __stripe_*, _hj*, AWSALB*.
  cookie_names: []
reports:
  - id: pos_transactions
    enabled: true
    required: true
    filename: "pos-export.xlsx"
    note: >
      Checked live on one EU club on 2026-10-26 (supervised --inspect). The report
      lives in Membr Insights (insights.eu.membr.com), not on the club host. The
      admin sidebar "Informes" entry expands a submenu; its "Informes" child
      (ng-click sendTokenToReportBuilder) opens Insights in a NEW tab at /home.
      The script opens its own tab, follows that new tab, and stays on the
      allow-listed hosts. Insights UI was English on that club; the export has
      sheets "Report" and "Report Meta Data" with Report Name "POS Transaction".
      The vendored afsa_checks.py still requires the Spanish sheet and report
      names. It is not modified by this config.
    steps:
      - action: click_text
        texts: ["Informes"]
        host: club
        submenu: true
        opens_tab: true
        parent_selector: "a.Aside-menu-link.has-subMenu"
        child_selector: "a.Aside-submenu-link"
        guess: false
        source: "Live: admin sidebar parent (a.Aside-menu-link.has-subMenu), then submenu child a.Aside-submenu-link (ng-click sendTokenToReportBuilder). Opens Insights in a new tab."
      - action: click_text
        texts: ["My Reports"]
        host: insights
        guess: false
        source: "Live: Insights top nav has My Data and My Reports."
      - action: click_text
        texts: ["Transaction Reports"]
        host: insights
        guess: false
        source: "Live categories: Access, Booking, Email, Member, Package, Prospect Reports, Session Packs, Transaction Reports, PT Reports."
      - action: click_text
        texts: ["POS Transactions"]
        host: insights
        exact: true
        guess: false
        source: "Live: Transaction Reports holds Cash Register, POS Transactions, Past Transactions."
      - action: fill_date
        selector: "input[name='from']"
        which: from
        host: insights
        guess: false
        source: "Live: text input, value YYYY-MM-DD. Plain fill was applied (export metadata showed 00:00:00)."
      - action: fill_date
        selector: "input[name='until']"
        which: to
        host: insights
        guess: false
        source: "Live: text input, YYYY-MM-DD. Export metadata showed 23:59:59 for the same day."
      - action: ensure_gym
        texts: ["Select Gyms"]
        gym: "Anytime Fitness Sant Adrià"
        host: insights
        guess: false
        source: "Live: Select Gyms shows 2 gyms selected by default. Only the configured gym may remain, and the screen must show that before Run Report."
      - action: click_text
        texts: ["Run Report"]
        host: insights
        guess: false
        source: "Live: button with text Run Report. Wait for the row count to settle before downloading."
      - action: read_screen
        count_selectors: ["div:has-text('total rows') >> b"]
        total_selectors: []
        host: insights
        guess: partial
        source: "Live: '<b>N</b> total rows' next to the title. No on-screen money total was found. An error shows 'Oops, an error has occurred' beside 0 total rows."
      - action: download
        selectors:
          - "text='Download Report'"
          - "text='Download Report (.xlsx)'"
        two_step: true
        host: insights
        guess: false
        source: "Live: 'Download Report' opens a menu with (.csv), (.json) and (.xlsx). Click it, then the (.xlsx) entry."
  - id: member_payments
    enabled: false
    required: false
    filename: "membr-payments-{date}.xlsx"
    note: "Whole menu path is a guess. Leave disabled until --inspect shows the real report."
    steps:
      - action: click_text
        texts: ["My Reports", "Mis informes"]
        guess: true
      - action: click_text
        texts: ["Payments", "Pagos", "Transacciones"]
        guess: true
      - action: fill_date
        selector: "input[name='dateFrom']"
        guess: true
      - action: fill_date
        selector: "input[name='dateTo']"
        guess: true
      - action: click_text
        texts: ["Run Report", "Ejecutar informe"]
        guess: true
      - action: download
        selectors: ["text=Download", "text=Descargar", "text=Excel"]
        guess: true
  - id: direct_debits
    enabled: false
    required: false
    filename: "membr-debits-{date}.xlsx"
    note: "Whole menu path is a guess. Harlands is a separate inbox file, not this report."
    steps:
      - action: click_text
        texts: ["My Reports", "Mis informes"]
        guess: true
      - action: click_text
        texts: ["Direct Debits", "Domiciliaciones", "Adeudos"]
        guess: true
      - action: fill_date
        selector: "input[name='dateFrom']"
        guess: true
      - action: fill_date
        selector: "input[name='dateTo']"
        guess: true
      - action: click_text
        texts: ["Run Report", "Ejecutar informe"]
        guess: true
      - action: download
        selectors: ["text=Download", "text=Descargar", "text=Excel"]
        guess: true
