# feina-stack — Hermes config for Feina client agents (no Orgo / X / Nous defaults)
model:
  default: gpt-5.6-sol
  provider: openai-codex
providers:
  openrouter:
    name: OpenRouter
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    transport: chat_completions
agent:
  max_turns: 60
  service_tier: fast
  verify_on_stop: false
  verbose: false
  reasoning_effort: medium
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
browser:
  inactivity_timeout: 120
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  threshold: 0.5
  target_ratio: 0.2
  protect_last_n: 20
  protect_first_n: 3
display:
  compact: false
  busy_input_mode: interrupt
  bell_on_complete: false
  show_reasoning: false
  streaming: true
  skin: default
  interim_assistant_messages: true
  tool_progress: all
  cleanup_progress: false
  long_running_notifications: true
  busy_ack_detail: true
  background_process_notifications: all
stt:
  enabled: true
  local:
    model: base
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  provider: ''
  nudge_interval: 10
  flush_min_turns: 6
delegation:
  max_iterations: 50
skills:
  creation_nudge_interval: 15
approvals:
  mode: true
  mcp_reload_confirm: true
  destructive_slash_confirm: true
hooks_auto_accept: false
code_execution:
  timeout: 300
  max_tool_calls: 50
streaming:
  enabled: false
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
updates:
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
secrets:
  onepassword:
    enabled: false
    env:
      LATITUDE_API_KEY: op://Feina/Hermes Agent Secrets/LATITUDE_API_KEY
      LATITUDE_PROJECT: op://Feina/Hermes Agent Secrets/LATITUDE_PROJECT
      TELEGRAM_BOT_TOKEN: op://Feina/Hermes Agent Secrets/TELEGRAM_BOT_TOKEN
      AGENTMAIL_API_KEY: op://Feina/Hermes Agent Secrets/AGENTMAIL_API_KEY
      AGENTMAIL_INBOX: op://Feina/Hermes Agent Secrets/AGENTMAIL_INBOX
      OPENROUTER_API_KEY: op://Feina/Hermes Agent Secrets/OPENROUTER_API_KEY
      COMPOSIO_CONSUMER_KEY: op://Feina/Hermes Agent Secrets/COMPOSIO_CONSUMER_KEY
    binary_path: /usr/bin/op
_config_version: 33
session_reset:
  mode: both
  idle_minutes: 1440
  at_hour: 4
group_sessions_per_user: true
platform_toolsets:
  telegram:
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
  cli:
    - clarify
    - code_execution
    - cronjob
    - delegation
    - file
    - kanban
    - memory
    - session_search
    - skills
    - terminal
    - todo
    - tts
    - vision
    - web
plugins:
  enabled:
    - latitude
    - openai
    - openai-codex
    - openai-codex-provider
    - openrouter
    - openrouter-provider
    - web-exa
    - web/firecrawl
  disabled:
    - novita-provider
mcp_servers:
  latitude:
    url: https://api.latitude.so/v1/mcp
    enabled: true
    headers:
      Authorization: Bearer ${LATITUDE_API_KEY}
  composio:
    url: https://connect.composio.dev/mcp
    enabled: true
    headers:
      x-consumer-api-key: ${COMPOSIO_CONSUMER_KEY}
  agentmail:
    url: https://mcp.agentmail.to/mcp
    enabled: true
    headers:
      x-api-key: ${AGENTMAIL_API_KEY}
  obsidian-vault:
    command: /usr/local/bin/mcp-server-filesystem
    args:
      - /root/Documents/HermesVault
    connect_timeout: 60
    enabled: true
image_gen:
  provider: openai-codex
  openai-codex:
    model: gpt-image-2-medium
